# fw0 v2 PF template. Rendered to /etc/pf.conf.candidate.
wan_if  = "@WAN_IF@"
lan_if  = "@LAN_IF@"
lan2_if = "@LAN2_IF@"
ts_if   = "@TS_IF@"
wg_if   = "@WG_IF@"
lan_net = "@LAN_NET@"
lan2_net = "@LAN2_NET@"
ts_port = "@TS_UDP_PORT@"

table <vpn_endpoints>  persist file "/etc/pf/tables/vpn_endpoints.txt"
table <xmpp_endpoints> persist file "/etc/pf/tables/xmpp_endpoints.txt"
table <control_dns>    persist file "/etc/pf/tables/control_dns.txt"

set skip on lo0
set block-policy drop
set reassemble yes

# Normalization/transforms must be evaluated before quick pass rules.
match in all scrub (no-df random-id)
match in on $lan_if inet proto tcp flags S/SA scrub (max-mss @WG_MSS_V4@)
match in on $wg_if  inet proto tcp flags S/SA scrub (max-mss @WG_MSS_V4@)

# NAT exists only on the encrypted data plane.
nat on $wg_if inet from { $lan_net, $lan2_net } to any -> ($wg_if:0)

block log all
antispoof quick for $lan_if
antispoof quick for $lan2_if

# Hard invariant: client addresses never leave via the physical WAN.
block out log quick on $wan_if inet from { $lan_net, $lan2_net } to any label "fw0:block-lan-to-wan"

# Never expose OpenSSH on physical WAN or ordinary LAN.
block in log quick on $wan_if inet proto tcp to ($wan_if) port 22 label "fw0:block-wan-ssh"
block in log quick on $lan_if inet proto tcp to ($lan_if) port 22 label "fw0:block-lan-ssh"
block in log quick on $lan2_if inet proto tcp to ($lan2_if) port 22 label "fw0:block-lan2-ssh"

# WAN DHCP client (for WAN_MODE=dhcp; harmlessly unmatched otherwise).
pass out quick on $wan_if inet proto udp from any port 68 to any port 67 keep state label "fw0:wan-dhcp-out"
pass in  quick on $wan_if inet proto udp from any port 67 to any port 68 keep state label "fw0:wan-dhcp-in"

# Management is reachable only through the Tailscale interface.
pass in quick on $ts_if inet proto tcp from any to ($ts_if) port 22 keep state label "fw0:allow-ts-ssh"

# Local LAN services. Daemons themselves remain disabled until Gate 05.
pass in quick on $lan_if inet proto udp from any port 68 to 255.255.255.255 port 67 label "fw0:allow-lan-dhcp"
pass in quick on $lan_if inet proto { tcp udp } from $lan_net to ($lan_if) port 53 keep state label "fw0:allow-lan-dns-local"
pass in quick on $lan2_if inet proto udp from any port 68 to 255.255.255.255 port 67 label "fw0:allow-lan2-dhcp"
pass in quick on $lan2_if inet proto { tcp udp } from $lan2_net to ($lan2_if) port 53 keep state label "fw0:allow-lan2-dns-local"

# Client DNS containment.
block in log quick on $lan_if inet proto { tcp udp } from $lan_net to !($lan_if) port 53 label "fw0:block-lan-dns-direct"
block in log quick on $lan_if inet proto tcp from $lan_net to any port 853 label "fw0:block-lan-dot"
block in log quick on $lan2_if inet proto { tcp udp } from $lan2_net to !($lan2_if) port 53 label "fw0:block-lan2-dns-direct"
block in log quick on $lan2_if inet proto tcp from $lan2_net to any port 853 label "fw0:block-lan2-dot"

# Las redes de datos permanecen aisladas entre sí.
block in quick on { $lan_if, $lan2_if } from { $lan_net, $lan2_net } to { $lan_net, $lan2_net } label "fw0:block-data-east-west"

# The sole client forwarding path.
pass in  quick on $lan_if inet from $lan_net to any no state label "fw0:lan-ingress"
pass in  quick on $lan2_if inet from $lan2_net to any no state label "fw0:lan2-ingress"
pass out quick on $wg_if  inet from { $lan_net, $lan2_net } to any keep state label "fw0:lan-vpn-egress"

# Control plane on FIB0/WAN. These are locally originated connections only.
pass out quick on $wan_if inet proto udp from ($wan_if) port $ts_port to any keep state label "fw0:tailscale-direct"
pass out quick on $wan_if inet proto udp from ($wan_if) to any port 3478 keep state label "fw0:tailscale-stun"
pass out quick on $wan_if inet proto tcp from ($wan_if) to any port 443 keep state label "fw0:control-https"
pass out quick on $wan_if inet proto udp from ($wan_if) to <vpn_endpoints> keep state label "fw0:wireguard-endpoints"
pass out quick on $wan_if inet proto tcp from ($wan_if) to <xmpp_endpoints> port 5222 keep state label "fw0:xmpp-rescue"
pass out quick on $wan_if inet proto { tcp udp } from ($wan_if) to <control_dns> port 53 keep state label "fw0:control-dns"

# Diagnostic ICMP from the router itself.
pass out quick on $wan_if inet proto icmp from ($wan_if) to any keep state label "fw0:control-icmp"
pass out quick on $wg_if  inet proto icmp from ($wg_if)  to any keep state label "fw0:vpn-icmp"

block log quick all
