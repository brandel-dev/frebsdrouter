# /usr/local/etc/fw0/inventory.conf
# Inventario declarativo. No contiene secretos.
# Gate 00 no permite avanzar mientras WAN_MODE permanezca UNSET.

HOSTNAME="freeboxx"

# Interfaces físicas observadas.
WAN_IF="re0"
WAN_MAC="10:e7:c6:01:97:6b"
LAN_IF="ue1"
LAN_MAC="6c:1f:f7:66:08:33"
AUX_IF="ue0"
AUX_MAC="6c:1f:f7:66:15:05"
AUX_ROLE="lan2"              # disabled | lan2 | vlan-trunk | mgmt-oob

TS_IF="tailscale0"
TS_UDP_PORT="41641"
WG_IF="wg0"

# Debe elegirse explícitamente: dhcp | static | pppoe
WAN_MODE="UNSET"
WAN_ADDR=""
WAN_MASK=""
WAN_GW=""

LAN_NET="10.10.80.0/24"
LAN_GW="10.10.80.1"
LAN_DHCP_START="10.10.80.100"
LAN_DHCP_END="10.10.80.199"

# Segunda red de datos: router downstream. No se bridgea con LAN.
LAN2_IF="ue0"
LAN2_MAC="6c:1f:f7:66:15:05"
LAN2_NET="10.10.90.0/24"
LAN2_GW="10.10.90.1"
LAN2_DHCP_START="10.10.90.100"
LAN2_DHCP_END="10.10.90.199"

AUX_NET="10.10.90.0/24"
AUX_GW="10.10.90.1"
AUX_DHCP_START="10.10.90.100"
AUX_DHCP_END="10.10.90.199"

FIB_CONTROL="0"
FIB_DATA="1"

WG_MTU="1420"
WG_MSS_V4="1380"

# Prueba de egress. Debe responder ICMP por la VPN.
EGRESS_PROBE_IP="1.1.1.1"
DNS_PROBE_HOST="example.com"

# Rollback PF si no se confirma desde una NUEVA sesión remota.
PF_CONFIRM_TIMEOUT="60"

XMPP_FQDN=""
XMPP_IP=""
XMPP_PORT="5222"
ZT_IF=""
ZT_NETWORK_ID=""
